name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Locked restore, Release build, tests and self-contained ZIP
        shell: pwsh
        run: ./scripts/Build.ps1 -Task Verify
      - uses: actions/upload-artifact@v4
        with:
          name: DnD.CharSheet-win-x64
          path: artifacts/DnD.CharSheet-win-x64.zip
          if-no-files-found: error
